name: Deploy SLOY presentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check scripts and package the static presentation
        run: |
          node --check deck.js
          node --check prototypes.js
          mkdir _site
          cp index.html deck.css deck.js prototypes.js _site/
          cp -R assets _site/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
